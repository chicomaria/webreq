<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="base.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script src="ui.js"></script>
<script src="registos.js"></script>
<title>Receção de mercadorias · Chico Maria</title>
<style>
.forn { padding: 12px; display: grid; gap: 8px; margin-top: 8px; }
.forn.ok { border-color: var(--ok); }
.forn.nok { border-color: var(--warn); }
.forn .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.forn .t strong { min-width: 0; overflow-wrap: anywhere; font-family: var(--font-display); font-size: 21px; letter-spacing: .03em; text-transform: uppercase; }
.forn .t .tag { flex: none; white-space: nowrap; }
.forn .arts { color: var(--muted); font-size: 13px; }
.forn .est { font-size: 13px; }
.dois { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dois button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 6px; font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); }
.dois button.sim[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--on-fill); }
.dois button.nao[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: var(--on-fill); }
.dois button.armed { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.dois button:disabled { opacity: .6; }
.semana { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
ul.his { list-style: none; margin: 0; padding: 0 12px 6px; }
ul.his li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
ul.his li:first-child { border-top: 0; }
ul.his li small { display: block; color: var(--muted); font-size: 12px; }
ul.his li .tag { flex: none; white-space: nowrap; }
.panel h3 { margin: 0; font-family: var(--font-display); font-size: 22px; text-transform: uppercase; letter-spacing: .04em; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1><a href="./" class="home" aria-label="Início">‹</a> Receção de mercadorias</h1><span class="sub" id="sub">A ligar…</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="sem" aria-selected="true">Esta semana</button>
      <button role="tab" data-tab="his" aria-selected="false">Histórico</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<script>
(async () => {
  const S = { db: null, loaded: { enc: false, rec: false }, encs: [], recs: [], tab: "sem", busy: new Set() };
  try { const t = localStorage.getItem("rc-tab"); if (t) S.tab = t; } catch (e) {}
  document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => { S.tab = b.dataset.tab; try { localStorage.setItem("rc-tab", S.tab); } catch (e) {} render(); }));
  const ESTADO = { conforme: ["Conforme", "ok"], nao_conforme: ["Não conforme", "warn"], auto: ["Conforme (automático)", "muted"], pendente: ["Por validar", ""] };
  const quando = (iso) => (diaKey(iso) === hojeKey() ? "hoje" : fmtDia(diaKey(iso))) + " às " + hora(iso);
  const artigos = (g) => g.itens.length ? textoArtigos(g.itens) : (g.registo && g.registo.artigos) || "";
  // a validation as one line: "Conforme, hoje às 10:00. Nota"
  const linhaReg = (r) => ESTADO[r.estado][0] + ", " + quando(r.em) + (r.nota ? ". " + r.nota : "");

  function render() {
    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
    const m = $("main"); m.replaceChildren();
    if (!S.db) { m.append(h("div", { class: "empty" }, h("strong", { text: S.db === false ? "Sem ligação à base de dados" : "A carregar…" }), S.db === false ? "Verifique a internet e recarregue a página." : "")); return; }
    if (!S.loaded.enc || !S.loaded.rec) { m.append(h("div", { class: "empty" }, h("strong", { text: "A carregar…" }))); return; }
    m.append(S.tab === "sem" ? viewSemana() : viewHis());
  }

  // weeks still open for validation: the current one, and the next one when an order from the weekend is already in
  function semanasAbertas() {
    const agora = new Date();
    return semanasComEncomendas(S.encs).filter((seg) => agora < prazoSemana(seg)).sort();
  }
  function viewSemana() {
    const frag = document.createDocumentFragment();
    const abertas = semanasAbertas();
    frag.append(h("p", { class: "note", text: "Valide os lotes de cada fornecedor que entregou esta semana. O que não for validado até sábado à noite fica registado como conforme." }));
    if (!abertas.length) {
      frag.append(h("div", { class: "card empty" }, h("strong", { text: "Nada para receber esta semana" }), "Quando fechar uma encomenda nas Encomendas, os fornecedores aparecem aqui."));
      return frag;
    }
    for (const seg of abertas) {
      const lista = rececaoDaSemana(S.encs, S.recs, seg).filter((g) => !g.semEncomenda);
      const falta = lista.filter((g) => g.estado === "pendente").length;
      frag.append(h("h2", { class: "sec semana" }, "Semana de " + fmtSemana(seg),
        h("small", { text: falta ? falta + " por validar até sábado " + fmtDia(somaDias(seg, 5)).replace(/^[^,]*, ?/, "") : "Tudo validado" })));
      for (const g of lista) frag.append(cartao(seg, g));
    }
    return frag;
  }
  // earlier lots of the same supplier this week (a later order is a new lot with its own validation)
  const lotesAnteriores = (r) => ((r && r.anteriores) || []).filter((a) => !a.mesmoLote);
  const linhaLote = (a) => "Lote anterior: " + linhaReg(a) + (a.artigos ? " · " + a.artigos : "");
  function cartao(seg, g) {
    const r = g.registo, busy = S.busy.has(g.id), [txt, cls] = ESTADO[g.estado];
    const novoLote = !!r && g.estado === "pendente";
    const arts = novoLote ? textoArtigos(g.itens.filter((l) => g.novas.includes(l.enc))) : r && r.artigos ? r.artigos : artigos(g);
    const linhas = novoLote ? [...lotesAnteriores(r).map(linhaLote), linhaLote(r)] : r ? [linhaReg(r), ...lotesAnteriores(r).map(linhaLote)] : [];
    // going back from Não conforme to Conforme takes a second tap (the note stays in the history)
    const armado = S.armado && S.armado.id === g.id;
    return h("div", { class: "card forn" + (g.estado === "conforme" ? " ok" : g.estado === "nao_conforme" ? " nok" : "") },
      h("div", { class: "t" }, h("strong", { text: g.fornecedor }), h("span", { class: "tag " + cls, text: novoLote ? "Novo lote" : txt })),
      h("div", { class: "arts", text: arts }),
      linhas.map((l) => h("div", { class: "est", text: l })),
      h("div", { class: "dois" },
        h("button", { type: "button", class: "sim" + (armado ? " armed" : ""), "aria-pressed": String(g.estado === "conforme"), disabled: busy, onclick: () => {
          if (g.estado === "nao_conforme" && !armado) { armar(g.id); return; }
          armar(null); validar(seg, g, "conforme");
        } }, armado ? "Tocar de novo" : "Conforme"),
        h("button", { type: "button", class: "nao", "aria-pressed": String(g.estado === "nao_conforme"), disabled: busy, onclick: () => naoConforme(seg, g) }, "Não conforme")));
  }
  function armar(id) {
    if (S.armado) clearTimeout(S.armado.t);
    S.armado = id ? { id, t: setTimeout(() => { S.armado = null; render(); }, 4000) } : null;
    render();
  }
  // saves the validation and ticks the lot's articles as received; true when saved, "mudou" when another phone validated
  // a lot this card does not show. The record it replaces is read fresh and goes to anteriores: an earlier lot, or the same lot changed.
  async function validar(seg, g, estado, nota, dialogoAberto) {
    if (S.busy.has(g.id) || (estado === "conforme" && g.estado === "conforme")) return false;
    S.busy.add(g.id); render();
    let ok = false;
    try {
      const d = (await S.db.carregar("rececoes")).get(g.id), r = d ? { id: g.id, ...d } : null;
      const vivas = new Set(S.encs.map((e) => e.id));
      if (r && (r.encs || []).some((e) => vivas.has(e) && !g.encs.includes(e))) {
        S.busy.delete(g.id); render();
        if (!dialogoAberto || !dialogoAberto()) toast("O registo de " + g.fornecedor + " mudou noutro telemóvel. Confirme de novo.");
        return "mudou";
      }
      const novas = r ? g.encs.filter((e) => !(r.encs || []).includes(e)) : g.encs, novoLote = !!r && novas.length > 0;
      const lote = r && !novoLote ? r.artigos || artigos(g) : textoArtigos(g.itens.filter((l) => novas.includes(l.enc)));
      const anteriores = r ? [...(r.anteriores || []), { estado: r.estado, nota: r.nota || "", em: r.em, artigos: r.artigos || "", encs: r.encs || [], mesmoLote: !novoLote }] : [];
      const em = new Date().toISOString();
      await S.db.collection("rececoes").doc(g.id).set({ semana: seg, fornecedor: g.fornecedor, estado, nota: nota || "", em, encs: [...new Set([...((r && r.encs) || []), ...g.encs])], artigos: lote, anteriores });
      ok = true;
      // a lot's articles are ticked when it is first validated (changing that validation later leaves the ticks alone)
      let falhou = false;
      for (const enc of !r ? g.encs : novoLote ? novas : []) {
        const rec = {}; for (const l of g.itens) if (l.enc === enc) rec[l.pid] = true;
        await S.db.collection("encomendas").doc(enc).update({ recebidos: rec }).catch(() => { falhou = true; });
      }
      toast(g.fornecedor + ": " + (estado === "conforme" ? "conforme" : "não conforme") + (falhou ? ". Os artigos não ficaram marcados como recebidos nas Encomendas." : ""));
    } catch (e) { if (!dialogoAberto || !dialogoAberto()) toast("Não foi possível guardar. Tente de novo."); }
    S.busy.delete(g.id); render();
    return ok;
  }
  function naoConforme(seg, g) {
    const r = g.registo;
    const ta = h("textarea", { id: "nc-nota", rows: 3, placeholder: "Ex.: peixe acima de 4 °C, caixa danificada, faltou 1 kg de alho" });
    ta.value = r && r.estado === "nao_conforme" && g.estado === "nao_conforme" ? r.nota || "" : "";
    const err = h("p", { class: "note", style: "color:var(--warn)" }); err.hidden = true;
    const save = h("button", { type: "submit", class: "btn primary" }, "Guardar");
    const form = h("form", { class: "form" }, h("h3", { text: g.fornecedor + ": não conforme" }),
      h("label", { for: "nc-nota" }, "O que não estava conforme? (opcional)", ta), err,
      h("div", { class: "row-actions" }, h("button", { type: "button", class: "btn", onclick: () => { ov.remove(); render(); } }, "Cancelar"), save));
    // the dialog stays open until the record is saved, so the note is not lost on a failed write
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault(); save.disabled = true; save.textContent = "A guardar…"; err.hidden = true;
      const res = await validar(seg, g, "nao_conforme", ta.value.trim(), () => ov.isConnected);
      if (res === true) { ov.remove(); render(); return; }
      save.disabled = false; save.textContent = "Guardar"; err.hidden = false;
      err.textContent = res === "mudou" ? "Outro telemóvel validou entretanto um lote novo deste fornecedor. Copie a nota, feche e confirme no cartão." : "Não foi possível guardar. Verifique a internet e tente de novo.";
    });
    const ov = h("div", { class: "overlay", onclick: (e) => { if (e.target === ov) { ov.remove(); render(); } } }, h("div", { class: "panel", role: "dialog", "aria-modal": "true", "aria-label": "Não conforme" }, form));
    document.body.append(ov); ta.focus();
  }

  function viewHis() {
    const frag = document.createDocumentFragment();
    const semanas = semanasDaRececao(S.encs, S.recs);
    // one CSV row per lot validation (a changed one says so) and one per lot taken as conforme or still to validate
    const rows = [];
    for (const seg of semanas) for (const g of rececaoDaSemana(S.encs, S.recs, seg)) {
      const r = g.registo, novos = textoArtigos(g.itens.filter((l) => g.novas.includes(l.enc)));
      for (const a of (r && r.anteriores) || []) rows.push([seg, g.fornecedor, ESTADO[a.estado][0] + (a.mesmoLote ? " (alterado depois)" : ""), diaKey(a.em) + " " + hora(a.em), a.nota || "", a.artigos || ""]);
      if (r) rows.push([seg, g.fornecedor, ESTADO[r.estado][0], diaKey(r.em) + " " + hora(r.em), r.nota || "", r.artigos || artigos(g)]);
      if (g.estado === "auto" || (r && g.novas.length && new Date() >= prazoSemana(seg))) rows.push([seg, g.fornecedor, ESTADO.auto[0], diaKey(prazoSemana(seg).toISOString()) + " 00:00", "", novos]);
      if (g.estado === "pendente") rows.push([seg, g.fornecedor, ESTADO.pendente[0], "", "", novos]);
    }
    frag.append(h("div", { class: "tools" }, h("button", { class: "btn", disabled: !rows.length, onclick: () => downloadCsv("rececao-mercadorias.csv",
      [["Semana (segunda)", "Fornecedor", "Estado", "Validado em", "Nota", "Artigos"], ...rows]) }, "Descarregar (Excel)")));
    if (!semanas.length) { frag.append(h("div", { class: "card empty" }, h("strong", { text: "Ainda não há receções" }), "As semanas com encomendas fechadas aparecem aqui.")); return frag; }
    for (const seg of semanas) {
      const lista = rececaoDaSemana(S.encs, S.recs, seg);
      // lots found non-conforme this week, earlier lots included
      const nok = lista.reduce((n, g) => n + (g.registo && g.registo.estado === "nao_conforme" ? 1 : 0) + lotesAnteriores(g.registo).filter((a) => a.estado === "nao_conforme").length, 0);
      frag.append(h("h2", { class: "sec semana" }, "Semana de " + fmtSemana(seg), h("small", { text: lista.length + (lista.length === 1 ? " fornecedor" : " fornecedores") + (nok ? " · " + nok + (nok === 1 ? " lote não conforme" : " lotes não conformes") : "") })));
      frag.append(h("div", { class: "card" }, h("ul", { class: "his" }, lista.map((g) => {
        const [txt, cls] = ESTADO[g.estado], r = g.registo;
        const det = [r ? quando(r.em) + (r.nota ? " · " + r.nota : "") + (r.artigos ? " · " + r.artigos : "") : g.estado === "auto" ? "Sem validação até sábado" : "",
          r && g.novas.length ? (g.estado === "pendente" ? "novo lote por validar" : "novo lote sem validação até sábado") : "",
          ...((r && r.anteriores) || []).map((a) => (a.mesmoLote ? "antes de alterado: " : "lote anterior: ") + ESTADO[a.estado][0].toLowerCase() + ", " + quando(a.em) + (a.nota ? " · " + a.nota : "") + (a.artigos ? " · " + a.artigos : ""))].filter(Boolean);
        return h("li", {}, h("span", {}, g.fornecedor, det.map((d) => h("small", { text: d }))), h("span", { class: "tag " + cls, text: txt }));
      }))));
    }
    return frag;
  }

  render();
  const db = await abrirDb();
  if (!db) { S.db = false; $("sub").textContent = "Sem ligação"; render(); return; }
  S.db = db; $("sub").textContent = "Lotes dos fornecedores";
  let t; const soon = () => { clearTimeout(t); t = setTimeout(() => { if (!document.querySelector(".overlay")) render(); }, 50); };
  db.collection("encomendas").onSnapshot((s) => { S.encs = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.enc = true; soon(); });
  db.collection("rececoes").onSnapshot((s) => { S.recs = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.rec = true; soon(); });
  // a week that passes Saturday while the page is open moves its pending lots to automatic
  setInterval(soon, 60000);
})();
</script>
</body>
</html>
