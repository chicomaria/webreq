<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="base.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script src="ui.js"></script>
<script src="dados.js"></script>
<script src="painel.js"></script>
<title>Fornecedores · Chico Maria</title>
<style>
.fc { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; min-width: 0; }
.fc:active { background: var(--accent-soft); }
.fc strong { font-size: 15px; line-height: 1.15; }
.fc .p { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fc .s { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fc a.ct { margin-top: auto; padding-top: 3px; font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fc .tag { align-self: flex-start; font-size: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1><a href="./" class="home" aria-label="Início">‹</a> Fornecedores</h1><span class="sub" id="sub">A ligar…</span></div>
  </header>
  <main id="main"></main>
  <datalist id="cats-f"></datalist>
</div>
<script>
(async () => {
  const S = { db: null, loaded: { f: false, p: false }, forn: [], produtos: [], q: "", abertas: new Set() };
  try { S.abertas = new Set(JSON.parse(localStorage.getItem("fr-abertas") || "[]")); } catch (e) {}
  const lembrar = () => { try { localStorage.setItem("fr-abertas", JSON.stringify([...S.abertas])); } catch (e) {} };

  // every supplier name used in the order app should match a supplier here (name or one of its "nomes na app")
  function ligacoes() {
    const mapa = new Map();
    for (const f of S.forn) for (const n of [f.nome, ...(f.nomesApp || [])]) mapa.set(norm(n), f.id);
    const porForn = new Map(), soltos = new Map();
    for (const p of S.produtos) {
      const n = (p.fornecedor || "").trim(); if (!n) continue;
      const id = mapa.get(norm(n));
      if (id) porForn.set(id, (porForn.get(id) || 0) + 1); else soltos.set(n, (soltos.get(n) || 0) + 1);
    }
    return { porForn, soltos };
  }

  // one contact on the card: phone, else email, else site
  function contacto(f) {
    const tel = (f.telefone || "").split(/[·;,/]| ou /)[0].trim();
    if (tel) return h("a", { class: "ct", href: "tel:" + tel.replace(/[^\d+]/g, ""), onclick: (e) => e.stopPropagation() }, "☎ " + tel);
    if (f.email) return h("a", { class: "ct", href: "mailto:" + f.email, onclick: (e) => e.stopPropagation() }, "✉ " + f.email);
    if (f.site) return h("a", { class: "ct", href: linkHref(f.site), target: "_blank", rel: "noopener", onclick: (e) => e.stopPropagation() }, "↗ " + f.site.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""));
    return h("span", { class: "s", text: "sem contacto" });
  }

  function render() {
    const m = $("main"); m.replaceChildren();
    if (!S.db) { m.append(h("div", { class: "empty" }, h("strong", { text: S.db === false ? "Sem ligação à base de dados" : "A carregar…" }))); return; }
    if (!S.loaded.f) { m.append(h("div", { class: "empty" }, h("strong", { text: "A carregar…" }))); return; }
    const cats = [...new Set(S.forn.map((f) => f.categoria || "Outros"))].sort((a, b) => a.localeCompare(b, "pt"));
    $("cats-f").replaceChildren(...cats.map((c) => h("option", { value: c })));
    const { porForn, soltos } = ligacoes();
    const busca = h("input", { type: "search", placeholder: "Procurar nome, produto ou terra", value: S.q, "aria-label": "Procurar fornecedor" });
    busca.addEventListener("input", () => { S.q = busca.value; const p = busca.selectionStart; render(); const b = document.querySelector("input[type=search]"); b.focus(); b.setSelectionRange(p, p); });
    const todas = cats.every((c) => S.abertas.has(c));
    m.append(h("div", { class: "tools" }, busca, h("button", { class: "btn primary", onclick: () => editar(null) }, "+ Fornecedor"),
      h("button", { class: "btn", onclick: () => { S.abertas = new Set(todas ? [] : cats); lembrar(); render(); } }, todas ? "Fechar todas" : "Abrir todas"),
      h("button", { class: "btn", onclick: exportar }, "Excel")));
    if (soltos.size && S.loaded.p) {
      m.append(h("div", { class: "alerta", style: "margin-top:10px" },
        h("strong", { text: "Nomes na app de encomendas sem ficha aqui: " }),
        [...soltos].map(([n, c], i) => [i ? ", " : "", h("b", { text: n }), " (" + c + ")"]),
        ". Junte o nome em “Nomes na app de encomendas” do fornecedor certo, ou crie-o."));
    }
    const q = norm(S.q);
    const lista = S.forn.filter((f) => !q || norm([f.nome, f.categoria, f.produtos, f.local, f.contacto, (f.nomesApp || []).join(" ")].join(" ")).includes(q));
    const grupos = [...new Set(lista.map((f) => f.categoria || "Outros"))].sort((a, b) => a.localeCompare(b, "pt"));
    for (const g of grupos) {
      const fs = lista.filter((f) => (f.categoria || "Outros") === g).sort((a, b) => a.nome.localeCompare(b.nome, "pt"));
      const d = h("details", { class: "grupo", open: !!q || S.abertas.has(g) },
        h("summary", {}, g, h("small", { text: String(fs.length) })),
        h("div", { class: "mosaico" }, fs.map((f) => {
          const n = porForn.get(f.id);
          return h("div", { class: "card fc", role: "button", tabindex: "0", title: [f.produtos, f.obs].filter(Boolean).join("\n"),
            onclick: () => editar(f), onkeydown: (e) => { if (e.key === "Enter") editar(f); } },
            h("strong", { text: f.nome }),
            f.produtos ? h("div", { class: "p", text: f.produtos }) : null,
            f.local ? h("div", { class: "s", text: f.local }) : null,
            n ? h("span", { class: "tag ok", text: n + (n === 1 ? " artigo" : " artigos") + " nas encomendas" }) : null,
            contacto(f));
        })));
      if (!q) d.addEventListener("toggle", () => { if (d.open) S.abertas.add(g); else S.abertas.delete(g); lembrar(); });
      m.append(d);
    }
    if (!lista.length) m.append(h("div", { class: "card empty" }, h("strong", { text: "Nenhum fornecedor encontrado" })));
    m.append(h("p", { class: "note", text: S.forn.length + " fornecedores. Toque num cartão para ver tudo e editar. O número de artigos vem da app de encomendas." }));
  }

  function editar(f) {
    const d = f ? { ...f, nomesApp: (f.nomesApp || []).join(", ") } : {};
    // all the supplier's contacts as buttons under the title
    const tels = f ? (f.telefone || "").split(/[·;,/]| ou /).map((t) => t.trim()).filter((t) => /\d{3}/.test(t)) : [];
    const topo = f && (tels.length || f.email || f.site) ? h("div", { class: "tools", style: "margin:0 0 10px" },
      tels.map((t) => h("a", { class: "btn", href: "tel:" + t.replace(/[^\d+]/g, "") }, "☎ " + t)),
      f.email ? h("a", { class: "btn", href: "mailto:" + f.email }, "✉ Email") : null,
      f.site ? h("a", { class: "btn", href: linkHref(f.site), target: "_blank", rel: "noopener" }, "↗ Site") : null) : null;
    abrirEditor({ titulo: f ? f.nome : "Novo fornecedor", dados: d, topo,
      campos: [{ k: "nome", label: "Nome" }, { k: "categoria", label: "Categoria", lista: "cats-f" }, { k: "produtos", label: "O que fornece", tipo: "textarea", rows: 2 },
        { k: "local", label: "Terra / morada" }, { k: "contacto", label: "Pessoa de contacto" }, { k: "telefone", label: "Telefone", tipo: "tel" },
        { k: "email", label: "Email", tipo: "email" }, { k: "site", label: "Site" }, { k: "obs", label: "Notas", tipo: "textarea" },
        { k: "nomesApp", label: "Nomes na app de encomendas", dica: "Como aparece no campo fornecedor dos artigos, separado por vírgulas." }],
      apagar: f ? () => S.db.collection("fornecedores").doc(f.id).delete() : null,
      guardar: (x) => {
        const data = { ...x, nomesApp: x.nomesApp.split(",").map((s) => s.trim()).filter(Boolean) };
        let id = f ? f.id : slugId(x.nome); if (!f) while (S.forn.some((y) => y.id === id)) id += "-2";
        return S.db.collection("fornecedores").doc(id).set(data);
      } });
  }
  function exportar() {
    downloadCsv("fornecedores.csv", [["Nome", "Categoria", "Produtos", "Local", "Contacto", "Telefone", "Email", "Site", "Notas", "Nomes na app"],
      ...S.forn.slice().sort((a, b) => a.nome.localeCompare(b.nome, "pt")).map((f) => [f.nome, f.categoria, f.produtos, f.local, f.contacto, f.telefone, f.email, f.site, f.obs, (f.nomesApp || []).join(", ")])]);
  }

  render();
  const db = await abrirPainel();
  if (!db) { S.db = false; render(); return; }
  S.db = db; $("sub").textContent = "Produtores e distribuidores";
  const re = agendar(render);
  db.collection("fornecedores").onSnapshot((s) => { S.forn = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.f = true; re(); });
  db.collection("produtos").onSnapshot((s) => { S.produtos = s.docs.map((d) => d.data()); S.loaded.p = true; re(); });
})();
</script>
</body>
</html>
