<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1ee">
<title>Encomendas · Chico Maria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a kitchen requisition pad. Sticky ticket header with tabs, list of lines grouped by section, carbon-copy blue ink for anything you can act on. */
:root {
  --bg: #eef1ee;
  --paper: #fbfcfa;
  --ink: #1b2420;
  --muted: #5f6d66;
  --line: #d5ddd8;
  --accent: #2a47a8;
  --accent-soft: #e3e8f7;
  --ok: #2f7a4b;
  --ok-soft: #e1f0e6;
  --warn: #a5532a;
  --warn-soft: #f6e6dc;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --paper: #1a211e; --ink: #e6ece8; --muted: #9aa9a1; --line: #2d3833;
    --accent: #8fa6ff; --accent-soft: #232c4a; --ok: #6cc290; --ok-soft: #1c3226; --warn: #e8996f; --warn-soft: #3a261b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121715; --paper: #1a211e; --ink: #e6ece8; --muted: #9aa9a1; --line: #2d3833;
  --accent: #8fa6ff; --accent-soft: #232c4a; --ok: #6cc290; --ok-soft: #1c3226; --warn: #e8996f; --warn-soft: #3a261b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.3; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 12px; padding-block: 0 110px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 6px 6px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .02em; margin: 0; text-transform: uppercase; }
.brand h1 a.home { color: var(--accent); text-decoration: none; padding-right: 4px; }
.brand .sub { color: var(--muted); font-size: 11px; }
nav.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; margin-top: 5px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
nav.tabs button { min-width: 0; overflow: hidden; white-space: nowrap; border: 0; background: transparent; padding: 5px 2px; border-radius: 6px; font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 4px; }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--paper); }
.badge { font-family: var(--font-mono); font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 0 7px; min-width: 22px; text-align: center; }
nav.tabs button[aria-selected="true"] .badge { background: var(--paper); color: var(--accent); }

.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-block: 6px 0; }
.search { flex: 1 1 160px; min-width: 0; padding: 6px 10px; font-size: 15px; border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); }
.chips { display: flex; gap: 5px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.chips .chip { flex: none; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 4px 10px; font-weight: 600; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.cat { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; margin: 10px 0 3px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
button.cat { width: 100%; border: 0; background: transparent; padding: 8px 2px; margin: 2px 0 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; color: var(--ink); }
button.cat .chev { display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
button.cat[aria-expanded="true"] .chev { transform: rotate(90deg); }
button.cat .on-n { color: var(--accent); }
.cost { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 10px; background: var(--accent-soft); border-radius: 8px; font-weight: 700; }
.cost .v { font-family: var(--font-mono); font-size: 17px; }
.cost small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.cat small { font-family: var(--font-body); font-weight: 600; font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--muted); }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 8px; min-height: 42px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.on { background: var(--accent-soft); }
.row .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step { display: flex; align-items: center; gap: 3px; }
.step button { width: 32px; height: 32px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); font-size: 18px; font-weight: 600; line-height: 1; }
.step button.plus { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.step input { width: 48px; height: 32px; font-size: 14px; text-align: center; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.step .u { width: 30px; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.floatbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 35%); pointer-events: none; }
.floatbar button { pointer-events: auto; display: flex; width: 100%; max-width: 728px; margin: 0 auto; justify-content: space-between; align-items: center; border: 0; border-radius: var(--radius); padding: 11px 16px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 15px; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 8px; overflow: hidden; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.card-h h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .03em; text-transform: uppercase; }
.card-h .tot { color: var(--muted); font-size: 12px; }
.lines { list-style: none; margin: 0; padding: 2px 0; font-size: 14px; }
.lines li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; padding: 3px 10px; align-items: baseline; }
.lines .q { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lines .e { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 64px; text-align: right; }
.lines label { display: contents; }
.lines li.got .n { text-decoration: line-through; color: var(--muted); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 10px 8px; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 6px 11px; font-weight: 600; font-size: 13px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.btn.danger { color: var(--warn); }
.btn.danger.armed { background: var(--warn); color: var(--paper); border-color: var(--warn); }
.btn:disabled { opacity: .5; cursor: default; }

.form { display: grid; gap: 8px; padding: 12px; }
.form label { display: grid; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
.form input, .form select, .form textarea { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font-size: 16px; color: var(--ink); font-weight: 400; min-width: 0; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.form .check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 15px; }
.form .check input { width: 20px; height: 20px; }

.empty { padding: 18px 12px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
.pill { font-size: 12px; font-weight: 700; border-radius: 99px; padding: 2px 9px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.wait { background: var(--warn-soft); color: var(--warn); }
.note { color: var(--muted); font-size: 12px; padding: 0 10px 8px; margin: 4px 0; }
.fab { position: fixed; right: 12px; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 26; border: 0; border-radius: 99px; padding: 10px 14px; background: var(--accent); color: var(--paper); font-weight: 700; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.22); }
.fab.low { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 40; max-width: calc(100% - 32px); }
.overlay { position: fixed; inset: 0; z-index: 30; background: rgba(10, 14, 12, .45); display: flex; align-items: flex-end; justify-content: center; padding-top: env(safe-area-inset-top, 0px); }
.overlay .panel { background: var(--paper); width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; border-radius: 14px 14px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 700px) { .overlay { align-items: center; } .overlay .panel { border-radius: 14px; } }
.ro-banner { margin-top: 6px; padding: 10px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script src="migracoes.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><a href="./" class="home" aria-label="Início">‹</a> Encomendas · Chico Maria</h1>
      <span class="sub" id="sub">A ligar…</span>
    </div>
    <nav class="tabs" role="tablist">
      <button id="t-enc" role="tab" aria-selected="true" data-tab="enc">Encomendar</button>
      <button id="t-res" role="tab" aria-selected="false" data-tab="res">Finalizar <span class="badge" id="badge">0</span></button>
      <button id="t-his" role="tab" aria-selected="false" data-tab="his">Histórico</button>
      <button id="t-art" role="tab" aria-selected="false" data-tab="art">Artigos</button>
    </nav>
  </header>
  <div id="ro" class="ro-banner" hidden>Pode consultar as listas, mas não tem permissão para as alterar.</div>
  <main id="main"></main>
</div>
<button class="fab" id="fab" type="button" hidden>+ Novo artigo</button>
<div class="floatbar" id="floatbar" hidden><button id="goRes"><span id="fbText">0 artigos na encomenda</span><span>Finalizar →</span></button></div>

<script>

(() => {
  const S = {
    db: null, user: null, uid: null, canWrite: true,
    produtos: new Map(), rasc: new Map(), encomendas: [], cats: [],
    loaded: { produtos: false, rasc: false, enc: false },
    tab: "enc", filtro: "semanal", q: "", qa: "", open: new Set(), names: {}, abertas: new Set(),
  };
  const $ = (id) => document.getElementById(id);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
    return el;
  }
  const fmtN = (n) => (n == null || n === "" ? "" : Number(n).toLocaleString("pt-PT", { maximumFractionDigits: 3 }));
  const fmtE = (n) => n.toLocaleString("pt-PT", { style: "currency", currency: "EUR" });
  const fmtD = (iso) => { try { return new Date(iso).toLocaleDateString("pt-PT", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" }); } catch (e) { return iso; } };
  const norm = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const slug = (s) => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "artigo";
  function toast(msg) { const t = h("div", { class: "toast", role: "status", text: msg }); document.body.append(t); setTimeout(() => t.remove(), 2600); }

  // estimated cost when the price unit can be compared with the order unit
  const U = { kg: ["kg", 1], g: ["kg", 0.001], l: ["l", 1], ml: ["l", 0.001], un: ["un", 1], uni: ["un", 1] };
  function custo(p, qtd) {
    if (p.preco == null || p.preco === "" || !qtd) return null;
    const a = U[norm(p.unidade)], b = U[norm(p.precoUnidade || p.unidade)];
    if (norm(p.unidade) === norm(p.precoUnidade || p.unidade)) return qtd * p.preco;
    if (a && b && a[0] === b[0]) return qtd * a[1] / b[1] * p.preco;
    return null;
  }
  const sortProd = (a, b) => (S.cats.indexOf(a.categoria) - S.cats.indexOf(b.categoria)) || ((a.ordem || 0) - (b.ordem || 0)) || a.nome.localeCompare(b.nome, "pt");
  function catsOf(list) {
    const known = [...S.cats];
    for (const p of list) if (!known.includes(p.categoria)) known.push(p.categoria);
    return known;
  }

  // ---------- writes ----------
  const chains = new Map();
  function serial(key, fn) { const p = (chains.get(key) || Promise.resolve()).then(fn, fn); chains.set(key, p.catch(() => {})); return p; }
  function writeErr(e) {
    if (e && e.code === "invalid_argument") { S.canWrite = false; $("ro").hidden = false; render(); }
    else if (e && e.code === "quota_exceeded") toast("A base de dados está cheia. Apague encomendas antigas.");
    else toast("Não foi possível guardar. Tente de novo.");
  }
  const pend = new Map(); const timers = new Map();
  function setQty(id, v) {
    v = Math.max(0, Math.round((Number(v) || 0) * 1000) / 1000);
    pend.set(id, v); paintRow(id); paintCounts();
    clearTimeout(timers.get(id));
    timers.set(id, setTimeout(() => {
      const val = pend.get(id);
      const ref = S.db.collection("rascunho").doc(id);
      serial("r:" + id, () => val > 0 ? ref.set({ qtd: val, por: S.uid || "", em: Date.now() }) : ref.delete())
        .then(() => { if (pend.get(id) === val) pend.delete(id); })
        .catch((e) => { pend.delete(id); paintRow(id); paintCounts(); writeErr(e); });
    }, 450));
  }
  const qtyOf = (id) => pend.has(id) ? pend.get(id) : (S.rasc.get(id)?.qtd || 0);
  function cartIds() {
    const ids = new Set([...S.rasc.keys(), ...pend.keys()]);
    return [...ids].filter((id) => qtyOf(id) > 0);
  }

  // ---------- tabs ----------
  document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
  $("goRes").addEventListener("click", () => setTab("res"));
  $("fab").addEventListener("click", () => editor(null));
  function setTab(t) {
    S.tab = t;
    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    try { localStorage.setItem("tab", t); } catch (e) {}
    render(); window.scrollTo(0, 0);
  }
  try { const a = JSON.parse(localStorage.getItem("abertas") || "[]"); if (Array.isArray(a)) S.abertas = new Set(a); } catch (e) {}
  try { const t = localStorage.getItem("tab"); if (t) S.tab = t; const f = localStorage.getItem("filtro"); if (f) S.filtro = f; } catch (e) {}
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));

  function render() {
    const m = $("main"); m.replaceChildren();
    if (!S.db) { m.append(S.dbFailed ? emptyBox("Não foi possível abrir a base de dados", "Verifique a ligação à internet e recarregue a página.") : emptyBox("A carregar…", "A ligar à lista de artigos.")); paintCounts(); return; }
    if (S.tab === "enc") m.append(viewEnc());
    else if (S.tab === "res") m.append(viewRes());
    else if (S.tab === "his") m.append(viewHis());
    else m.append(viewArt());
    paintCounts();
  }
  function emptyBox(t, s) { return h("div", { class: "empty" }, h("strong", { text: t }), s); }
  function paintCounts() {
    const n = cartIds().length;
    $("badge").textContent = n;
    $("fbText").textContent = n === 1 ? "1 artigo na encomenda" : n + " artigos na encomenda";
    $("floatbar").hidden = !(S.tab === "enc" && n > 0);
    const fab = $("fab"); fab.hidden = !(S.db && S.canWrite && (S.tab === "enc" || S.tab === "art")); fab.classList.toggle("low", $("floatbar").hidden);
  }

  // ---------- collapsible groups ----------
  // categories start closed on the phone; a search or the "Na encomenda" filter opens everything
  function groupEl(key, title, info, body, forceOpen) {
    const open = forceOpen || S.abertas.has(key);
    const wrap = h("section", {});
    const btn = h("button", { type: "button", class: "cat", "aria-expanded": String(open) },
      h("span", {}, h("span", { class: "chev", "aria-hidden": "true" }, "▸"), " ", title), info);
    body.hidden = !open;
    btn.addEventListener("click", () => {
      const now = body.hidden; body.hidden = !now; btn.setAttribute("aria-expanded", String(now));
      if (!forceOpen) { now ? S.abertas.add(key) : S.abertas.delete(key); try { localStorage.setItem("abertas", JSON.stringify([...S.abertas])); } catch (e) {} }
    });
    wrap.append(btn, body);
    return wrap;
  }

  // ---------- Encomendar ----------
  function viewEnc() {
    const frag = document.createDocumentFragment();
    const search = h("input", { id: "q-enc", class: "search", type: "search", placeholder: "Procurar artigo…", value: S.q, "aria-label": "Procurar artigo" });
    search.addEventListener("input", () => { S.q = search.value; drawList(); });
    const chip = (key, label) => h("button", { class: "chip", "aria-pressed": String(S.filtro === key), onclick: () => { S.filtro = key; try { localStorage.setItem("filtro", key); } catch (e) {} render(); } }, label);
    frag.append(h("div", { class: "tools" }, search, h("div", { class: "chips" }, chip("semanal", "Frequentes"), chip("todos", "Todos"), chip("fornecedor", "Por fornecedor"), chip("pedidos", "Na encomenda"))));
    const list = h("div", { id: "enc-list" });
    frag.append(list);
    function drawList() {
      list.replaceChildren();
      if (!S.loaded.produtos) { list.append(emptyBox("A carregar artigos…", "")); return; }
      const q = norm(S.q.trim());
      let ps = [...S.produtos.values()].filter((p) => {
        if (q) return norm(p.nome).includes(q) || norm(p.fornecedor).includes(q);
        if (S.filtro === "semanal") return p.semanal || qtyOf(p.id) > 0;
        if (S.filtro === "pedidos") return qtyOf(p.id) > 0;
        return true;
      }).sort(sortProd);
      if (!ps.length) {
        list.append(S.produtos.size ? emptyBox("Nenhum artigo encontrado", q ? "Experimente outro nome, ou crie o artigo no separador Artigos." : "Ainda não escolheu nenhum artigo.") : emptyBox("Ainda não há artigos", "Adicione o primeiro no separador Artigos."));
        return;
      }
      const groups = S.filtro === "fornecedor" && !q
        ? groupBySupplier(ps)
        : catsOf(ps).map((c) => [c, ps.filter((p) => p.categoria === c)]);
      for (const [c, items] of groups) {
        if (!items.length) continue;
        const nOn = items.filter((p) => qtyOf(p.id) > 0).length;
        const key = (S.filtro === "fornecedor" && !q ? "f:" : "c:") + c;
        list.append(groupEl(key, c, h("small", {}, nOn ? h("span", { class: "on-n", text: nOn + " na encomenda · " }) : "", String(items.length)), h("div", { class: "sheet" }, items.map(rowEl)), !!q || S.filtro === "pedidos"));
      }
    }
    drawList();
    return frag;
  }
  function stepFor(p) { const u = norm(p.unidade); return (u === "g" || u === "ml") ? 50 : 1; }
  function rowEl(p) {
    const meta = [p.habitual ? "hab. " + fmtN(p.habitual) + " " + (p.unidade || "") : "", p.fornecedor].filter(Boolean).join(" · ");

  // ---------- PDF ----------
  function pdfButton(getData) {
    const b = h("button", { class: "btn" }, "Descarregar PDF");
    b.hidden = !S.downloads;
    b.addEventListener("click", async () => {
      if (!window.jspdf) { toast("O gerador de PDF não carregou. Verifique a ligação e tente de novo."); return; }
      b.disabled = true;
      try {
        const d = getData();
        const bytes = buildPdf(d);
        const nome = "encomenda-chico-maria-" + (d.data || new Date().toISOString()).slice(0, 10) + ".pdf";
        await S.downloads.save({ filename: nome, data: bytes });
      } catch (e) {
        if (e && e.code === "declined") {}
        else if (e && (e.code === "unavailable" || e.code === "not_granted")) { S.downloads = null; b.hidden = true; toast("Não é possível descarregar ficheiros nesta vista."); }
        else toast("Não foi possível criar o PDF.");
      } finally { b.disabled = false; }
    });
    return b;
  }
  function buildPdf(d) {
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
    const W = 210, M = 14; let y = 18;
    const room = (hgt) => { if (y + hgt > 284) { doc.addPage(); y = 18; } };
    const eur = (n) => n.toFixed(2).replace(".", ",") + " EUR";
    doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text("Encomenda - Chico Maria", M, y); y += 7;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    const info = ["Data: " + new Date(d.data).toLocaleDateString("pt-PT")];
    if (d.entrega) info.push("Entrega: " + new Date(d.entrega + "T12:00").toLocaleDateString("pt-PT"));
    doc.text(info.join("    "), M, y); y += 5;
    if (d.nota) { const t = doc.splitTextToSize("Nota: " + d.nota, W - 2 * M); doc.text(t, M, y); y += t.length * 4.5; }
    y += 3;
    let total = 0;
    for (const [forn, ls] of d.groups) {
      room(18);
      doc.setFillColor(230, 234, 245); doc.rect(M, y - 4.5, W - 2 * M, 7, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.text(forn, M + 2, y); 
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.text(ls.length + (ls.length === 1 ? " artigo" : " artigos"), W - M - 2, y, { align: "right" });
      y += 7; doc.setFontSize(10);
      let sub = 0;
      for (const l of ls) {
        room(6);
        const c = custo(l, l.qtd); if (c != null) sub += c;
        const nome = doc.splitTextToSize(l.nome, 110);
        doc.text(nome, M + 2, y);
        doc.text(fmtN(l.qtd) + " " + (l.unidade || ""), 150, y, { align: "right" });
        if (c != null) doc.text(eur(c), W - M - 2, y, { align: "right" });
        y += Math.max(1, nome.length) * 4.6 + 2;
        doc.setDrawColor(220, 224, 222); doc.line(M, y - 4.3, W - M, y - 4.3);
      }
      if (sub) { doc.setFont("helvetica", "bold"); doc.text("Estimado: " + eur(sub), W - M - 2, y + 1, { align: "right" }); doc.setFont("helvetica", "normal"); y += 6; }
      total += sub; y += 4;
    }
    room(14);
    doc.setFontSize(9); doc.setTextColor(110);
    doc.text("Valores estimados sem IVA, só para artigos com preço na mesma unidade da encomenda." + (total ? " Total estimado: " + eur(total) + "." : ""), M, y + 2, { maxWidth: W - 2 * M });
    return doc.output("arraybuffer");
  }

        const ordem = !isNew && p.categoria === cat ? p.ordem : (sameCat.reduce((m, x) => Math.max(m, x.ordem || 0), 0) + 5);
        const id = isNew ? slug(nome) + "-" + Math.random().toString(36).slice(2, 6) : p.id;
        const data = { nome, categoria: cat, unidade: f.unidade.value.trim(), habitual: hab, fornecedor: f.forn.value.trim(), preco: pr, precoUnidade: f.precoUn.value.trim() || f.unidade.value.trim(), obs: f.obs.value.trim(), semanal: f.sem.checked, ordem };
        await serial("p:" + id, () => S.db.collection("produtos").doc(id).set(data));
        toast(isNew ? "Artigo criado e disponível para todos" : "Alterações guardadas"); ov.remove();
      } catch (e) { save.disabled = false; writeErr(e); }
    });
    let armed = false;
    del.addEventListener("click", async () => {
      if (!armed) { armed = true; del.classList.add("armed"); del.textContent = "Tocar de novo para apagar"; setTimeout(() => { armed = false; del.classList.remove("armed"); del.textContent = "Apagar artigo"; }, 4000); return; }
      try { await S.db.collection("produtos").doc(p.id).delete(); if (S.rasc.has(p.id)) await S.db.collection("rascunho").doc(p.id).delete(); toast("Artigo apagado"); ov.remove(); } catch (e) { writeErr(e); }
    });
    const ov = h("div", { class: "overlay", onclick: (ev) => { if (ev.target === ov) ov.remove(); } }, h("div", { class: "panel", role: "dialog", "aria-modal": "true", "aria-label": isNew ? "Novo artigo" : "Editar artigo" }, form));
    document.body.append(ov); (isNew ? f.nome : f.habitual).focus();
  }

  // ---------- data updates shipped with the app ----------
  // Each runs once per database (recorded in config/migracoes) and never overwrites what the team already edited.
  const MIGRACOES = window.MIGRACOES || [];
  let migrando = false;
  async function migrar() {
    if (migrando || !S.loaded.produtos || !S.loaded.cfg || !S.loaded.mig) return;
    const feitas = new Set(S.migFeitas), falta = MIGRACOES.filter((m) => !feitas.has(m.id));
    if (!falta.length) return;
    migrando = true;
    try {
      for (const m of falta) {
        const add = m.categorias || [];
        if (add.some((c) => !S.cats.includes(c))) { S.cats = [...S.cats, ...add.filter((c) => !S.cats.includes(c))]; await S.db.doc("config/categorias").set({ lista: S.cats }); }
        for (const [id, d] of Object.entries(m.novos || {})) if (!S.produtos.has(id)) await S.db.collection("produtos").doc(id).set(d);
        for (const [id, d] of Object.entries(m.precos || {})) {
          const p = S.produtos.get(id);
          if (p && (p.preco == null || p.preco === "")) {
            const { nota, ...upd } = d;
            if (nota) upd.obs = ((p.obs || "") + " " + nota).trim();
            await S.db.collection("produtos").doc(id).update(upd);
          }
        }
        for (const [id, x] of Object.entries(m.ajustes || {})) {
          const p = S.produtos.get(id);
          if (p && Number(p.preco) === x.se && (p.precoUnidade || "") === x.seUn) await S.db.collection("produtos").doc(id).update(x.set);
        }
        // updates from the spreadsheet the team filled in: overwrite these fields, keep order counts
        for (const [id, d] of Object.entries(m.atualizar || {})) {
          if (S.produtos.has(id)) await S.db.collection("produtos").doc(id).update(d);
          else await S.db.collection("produtos").doc(id).set(d);
        }
        for (const id of m.apagar || []) if (S.produtos.has(id)) await S.db.collection("produtos").doc(id).delete();
        feitas.add(m.id);
        await S.db.doc("config/migracoes").set({ feitas: [...feitas] });
      }
    } catch (e) {} finally { migrando = false; }
  }

  // ---------- data ----------
  let rT;
  function soon() { clearTimeout(rT); rT = setTimeout(() => {
    const a = document.activeElement;
    // keep typing undisturbed: on the order list only repaint rows and counts
    if (S.tab === "enc" && a && a.tagName === "INPUT") { for (const id of S.produtos.keys()) paintRow(id); paintCounts(); return; }
    if (document.querySelector(".overlay")) { paintCounts(); return; }
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }, 60); }
  render();
  (async () => {
    let db = null;
    try { db = supabaseDb(window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } })); } catch (e) {}
    if (!db) { S.dbFailed = true; $("sub").textContent = "Sem ligação"; render(); return; }
    S.db = db;
    S.downloads = fileDownloads;
    $("sub").textContent = "Lista partilhada pela equipa";
    const onErr = () => {};
    db.doc("config/categorias").onSnapshot((s) => { S.cats = (s.exists && Array.isArray(s.data().lista)) ? [...s.data().lista] : S.cats; S.loaded.cfg = true; soon(); migrar(); }, onErr);
    db.doc("config/migracoes").onSnapshot((s) => { S.migFeitas = (s.exists && Array.isArray(s.data().feitas)) ? s.data().feitas : []; S.loaded.mig = true; migrar(); }, onErr);
    db.collection("produtos").onSnapshot((snap) => { S.produtos = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }])); S.loaded.produtos = true; soon(); migrar(); }, onErr);
    db.collection("rascunho").onSnapshot((snap) => { S.rasc = new Map(snap.docs.map((d) => [d.id, d.data()])); S.loaded.rasc = true; soon(); }, onErr);
    db.collection("encomendas").orderBy("criada", "desc").limit(60).onSnapshot((snap) => { S.encomendas = snap.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.enc = true; soon(); }, onErr);
    render();
  })();
})();
</script>
</body>
</html>
