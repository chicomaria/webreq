<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="base.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script src="ui.js"></script>
<title>Chico Maria · Backoffice</title>
<style>
.tiles { display: grid; gap: 10px; margin-top: 14px; }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
a.tile { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 16px 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; color: var(--ink); text-decoration: none; }
a.tile:active { background: var(--accent-soft); }
a.tile svg { width: 48px; height: 48px; padding: 10px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
a.tile strong { display: block; font-family: var(--font-display); font-size: 22px; letter-spacing: .03em; text-transform: uppercase; }
a.tile span.s { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
a.tile .go { color: var(--muted); font-size: 22px; }
.date { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand"><h1>Chico Maria · Backoffice</h1><span class="sub" id="sub">A ligar…</span></div></header>
  <div class="date" id="hoje"></div>
  <div class="tiles">
    <a class="tile" href="encomendas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 11h6M9 15h6"/></svg>
      <div><strong>Encomendas</strong><span class="s" id="s-enc">Requisições aos fornecedores</span></div><span class="go" aria-hidden="true">›</span>
    </a>
    <a class="tile" href="temperaturas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V4a2 2 0 1 0-4 0v10.8a4 4 0 1 0 4 0z"/><path d="M12 9v7"/></svg>
      <div><strong>Temperaturas</strong><span class="s" id="s-tmp">Registo dos 6 frios</span></div><span class="go" aria-hidden="true">›</span>
    </a>
    <a class="tile" href="horarios.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div><strong>Horários</strong><span class="s" id="s-hor">Entradas e saídas da equipa</span></div><span class="go" aria-hidden="true">›</span>
    </a>
  </div>
</div>
<script>
(() => {
  const d = new Date().toLocaleDateString("pt-PT", { weekday: "long", day: "numeric", month: "long" });
  $("hoje").textContent = d;
  const db = openDb();
  if (!db) { $("sub").textContent = "Sem ligação"; return; }
  $("sub").textContent = "Equipa";
  db.collection("rascunho").onSnapshot((s) => { const n = s.docs.length; $("s-enc").textContent = n ? n + (n === 1 ? " artigo" : " artigos") + " na encomenda em curso" : "Requisições aos fornecedores"; });
  db.collection("temperaturas").onSnapshot((s) => {
    const hoje = diaKey(new Date().toISOString());
    const frios = new Set(s.docs.map((x) => x.data()).filter((t) => diaKey(t.em) === hoje).map((t) => t.frio));
    $("s-tmp").textContent = frios.size + " de 6 frios registados hoje";
  });
  db.collection("picagens").onSnapshot((s) => {
    const last = new Map();
    for (const d of s.docs.map((x) => x.data()).sort((a, b) => a.em.localeCompare(b.em))) last.set(d.pessoa, d);
    const dentro = [...last.values()].filter((d) => d.tipo === "entrada").map((d) => d.nome);
    $("s-hor").textContent = dentro.length ? "Na casa: " + dentro.join(", ") : "Ninguém registado na casa";
  });
})();
</script>
</body>
</html>
