<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="base.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script src="ui.js"></script>
<title>Temperaturas · Chico Maria</title>
<style>
.big { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 6px 0; }
.big input { width: 140px; text-align: center; font-family: var(--font-mono); font-size: 34px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
.big button { width: 52px; height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 22px; font-weight: 700; }
.big .u { font-size: 20px; color: var(--muted); }
.panel h3 { margin: 0; font-family: var(--font-display); font-size: 22px; text-transform: uppercase; letter-spacing: .04em; }
ul.today { list-style: none; margin: 4px 0 0; padding: 0; font-size: 14px; }
ul.today li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); }
ul.today .btn { padding: 3px 8px; font-size: 12px; }
table.mat td.n { font-size: 13px; }
.step { margin-top: 12px; padding: 16px 14px; display: grid; gap: 8px; }
.step .num { text-align: center; font-size: 13px; color: var(--muted); font-weight: 600; }
.step h2.fn { margin: 0; text-align: center; font-family: var(--font-display); font-size: 26px; letter-spacing: .03em; text-transform: uppercase; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots span { width: 10px; height: 10px; border-radius: 99px; background: var(--line); }
.dots span.done { background: var(--ok); }
.dots span.on { background: var(--accent); }
.step .nav { display: grid; grid-template-columns: auto auto 1fr; gap: 8px; margin-top: 6px; }
.big-next { justify-content: center; font-size: 17px; padding: 12px; }
table.mat td.n small { display: block; color: var(--muted); font-size: 10px; font-family: var(--font-body); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1><a href="./" class="home" aria-label="Início">‹</a> Temperaturas</h1><span class="sub" id="sub">A ligar…</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="reg" aria-selected="true">Registar</button>
      <button role="tab" data-tab="his" aria-selected="false">Histórico</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<script>
(() => {
  const FRIOS = [
    { n: 1, nome: "Banca frio cozinha" }, { n: 2, nome: "Frio bar" }, { n: 3, nome: "Frio vertical armazém" },
    { n: 4, nome: "Congelador vertical armazém" }, { n: 5, nome: "Arca branca" }, { n: 6, nome: "Arca gelados" },
  ];
  const S = { db: null, loaded: false, regs: [], tab: "reg", mes: mesKey(new Date().toISOString()) };
  const fmtT = (t) => Number(t).toLocaleString("pt-PT", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  try { const t = localStorage.getItem("tmp-tab"); if (t) S.tab = t; } catch (e) {}
  document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => { S.tab = b.dataset.tab; try { localStorage.setItem("tmp-tab", S.tab); } catch (e) {} render(); }));

  function render() {
    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
    const m = $("main"); m.replaceChildren();
    if (!S.db) { m.append(h("div", { class: "empty" }, h("strong", { text: "Sem ligação à base de dados" }), "Verifique a internet e recarregue a página.")); return; }
    if (!S.loaded) { m.append(h("div", { class: "empty" }, h("strong", { text: "A carregar…" }))); return; }
    m.append(S.tab === "reg" ? viewReg() : viewHis());
  }

  function ultimo(frio) { let u = null; for (const r of S.regs) if (r.frio === frio && (!u || r.em > u.em)) u = r; return u; }
  function quando(iso) {
    const hoje = diaKey(new Date().toISOString()), d = diaKey(iso);
    if (d === hoje) return "hoje às " + hora(iso);
    const ontem = diaKey(new Date(Date.now() - 864e5).toISOString());
    return (d === ontem ? "ontem às " : fmtDia(d) + " às ") + hora(iso);
  }
  // one round = fridge 1 to 6 in a row; each reading is saved when you move on, so a half round is never lost
  const R = { i: 0, ids: {}, vals: {}, fim: null, corr: false };
  function viewReg() {
    const frag = document.createDocumentFragment();
    if (R.fim) return viewFim();
    const f = FRIOS[R.i], u = ultimo(f.n);
    const inp = h("input", { id: "t-inp", type: "text", inputmode: "decimal", autocomplete: "off", "aria-label": "Temperatura de " + f.nome, placeholder: u ? fmtT(u.temp) : "0,0", value: R.vals[f.n] != null ? fmtT(R.vals[f.n]) : "" });
    const val = () => { const s = inp.value.trim().replace(",", ".").replace("−", "-"); return s === "" ? NaN : Number(s); };
    const step = (d) => { const base = isNaN(val()) ? (u ? u.temp : 0) : val(); inp.value = fmtT(Math.round((base + d) * 10) / 10); };
    const err = h("p", { class: "note", style: "color:var(--warn);text-align:center" }); err.hidden = true;
    const last = R.i === FRIOS.length - 1;
    const next = h("button", { type: "submit", class: "btn primary big-next" }, last ? "Finalizar" : "Próximo →");
    const form = h("form", { class: "step card" },
      h("div", { class: "dots", "aria-hidden": "true" }, FRIOS.map((x, k) => h("span", { class: k === R.i ? "on" : (R.ids[x.n] ? "done" : "") }))),
      h("div", { class: "num", text: "Frio " + f.n + " de 6" }),
      h("h2", { class: "fn", text: f.nome }),
      h("div", { class: "big" }, h("button", { type: "button", "aria-label": "Menos 0,1", onclick: () => step(-0.1) }, "−"), inp, h("span", { class: "u", text: "°C" }), h("button", { type: "button", "aria-label": "Mais 0,1", onclick: () => step(0.1) }, "+")),
      h("p", { class: "note", style: "text-align:center", text: u ? "Última leitura: " + fmtT(u.temp) + " °C, " + quando(u.em) : "Ainda sem leituras" }),
      err,
      h("div", { class: "nav" },
        h("button", { type: "button", class: "btn", disabled: R.i === 0, onclick: () => { R.i--; render(); } }, "← Anterior"),
        h("button", { type: "button", class: "btn", onclick: () => avancar() }, "Saltar"),
        next));
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const t = Math.round(val() * 10) / 10;
      if (isNaN(t) || t < -40 || t > 40) { err.textContent = "Escreva a temperatura, por exemplo 3,5 ou -18,2."; err.hidden = false; inp.focus(); return; }
      next.disabled = true;
      const em = new Date().toISOString();
      const data = { frio: f.n, nome: f.nome, temp: t, em, dia: diaKey(em), mes: mesKey(em) };
      try {
        // going back and changing a value updates the same reading instead of adding another
        if (R.ids[f.n]) await S.db.collection("temperaturas").doc(R.ids[f.n]).set(data);
        else { const id = newId(); await S.db.collection("temperaturas").doc(id).set(data); R.ids[f.n] = id; }
        R.vals[f.n] = t; avancar();
      } catch (e) { next.disabled = false; toast("Não foi possível guardar. Tente de novo."); }
    });
    frag.append(form);
    setTimeout(() => { const el = $("t-inp"); if (el) { el.focus(); el.select(); } });
    return frag;
  }
  function avancar() { if (R.corr) { R.corr = false; R.fim = R.fim0; } else if (R.i < FRIOS.length - 1) R.i++; else R.fim = new Date().toISOString(); render(); }
  function viewFim() {
    const frag = document.createDocumentFragment();
    const n = Object.keys(R.ids).length;
    frag.append(h("div", { class: "card step" },
      h("div", { class: "num", text: "Ronda terminada às " + hora(R.fim) }),
      h("h2", { class: "fn", text: n + " de 6 frios registados" }),
      h("ul", { class: "today" }, FRIOS.map((f, k) => h("li", {},
        h("span", {}, h("b", { text: f.n + " " }), f.nome),
        h("span", {}, h("strong", { text: R.vals[f.n] != null ? fmtT(R.vals[f.n]) + " °C" : "saltado" }), " ",
          h("button", { type: "button", class: "btn", onclick: () => { R.fim0 = R.fim; R.fim = null; R.corr = true; R.i = k; render(); } }, "Corrigir"))))),
      h("div", { class: "nav" }, h("span"), h("button", { type: "button", class: "btn primary", onclick: () => { R.i = 0; R.ids = {}; R.vals = {}; R.fim = null; R.corr = false; render(); } }, "Nova ronda"))));
    return frag;
  }
  function viewHis() {
    const frag = document.createDocumentFragment();
    const meses = [...new Set([mesKey(new Date().toISOString()), ...S.regs.map((r) => r.mes || mesKey(r.em))])].sort().reverse();
    if (!meses.includes(S.mes)) S.mes = meses[0];
    const sel = h("select", { "aria-label": "Mês" }, meses.map((k) => h("option", { value: k, selected: k === S.mes }, fmtMes(k))));
    sel.addEventListener("change", () => { S.mes = sel.value; render(); });
    const regs = S.regs.filter((r) => (r.mes || mesKey(r.em)) === S.mes).sort((a, b) => a.em.localeCompare(b.em));
    const csv = h("button", { class: "btn", disabled: !regs.length, onclick: () => downloadCsv("temperaturas-" + S.mes + ".csv", [["Data", "Hora", "Frio", "Nome", "Temperatura (°C)"], ...regs.map((r) => [diaKey(r.em), hora(r.em), r.frio, (FRIOS.find((f) => f.n === r.frio) || {}).nome || "", String(r.temp).replace(".", ",")])]) }, "Descarregar (Excel)");
    frag.append(h("div", { class: "tools" }, sel, csv));
    if (!regs.length) { frag.append(h("div", { class: "card empty" }, h("strong", { text: "Sem registos neste mês" }))); return frag; }
    const dias = [...new Set(regs.map((r) => diaKey(r.em)))].sort().reverse();
    const tb = h("tbody");
    for (const d of dias) {
      tb.append(h("tr", {}, h("td", { text: fmtDia(d) }), FRIOS.map(({ n: f }) => {
        const rs = regs.filter((r) => r.frio === f && diaKey(r.em) === d);
        return h("td", { class: "n" }, rs.length ? rs.map((r) => h("div", {}, fmtT(r.temp), h("small", { text: hora(r.em) }))) : "—");
      })));
    }
    frag.append(h("div", { class: "card scroll" }, h("table", { class: "data mat" }, h("thead", {}, h("tr", {}, h("th", { text: "Dia" }), FRIOS.map((f) => h("th", { class: "n", title: f.nome, text: f.n })))), tb)));
    frag.append(h("p", { class: "note", text: FRIOS.map((f) => f.n + " " + f.nome).join(" · ") }));
    frag.append(h("p", { class: "note", text: regs.length + " registos em " + fmtMes(S.mes).toLowerCase() + ". Temperaturas em °C." }));
    return frag;
  }

  render();
  const db = openDb();
  if (!db) { $("sub").textContent = "Sem ligação"; render(); return; }
  S.db = db; $("sub").textContent = "6 frios";
  let t; db.collection("temperaturas").onSnapshot((s) => { S.regs = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded = true; clearTimeout(t); t = setTimeout(() => { if (!document.querySelector(".overlay") && !(document.activeElement && document.activeElement.id === "t-inp" && document.activeElement.value)) render(); }, 50); });
})();
</script>
</body>
</html>
